[project]
name = "netirava"
version = "0.1.0"
description = "Netirava MVP: completed-flow replay IDS with a supervised A0 detector and a shadow anomaly detector"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.4",
    "pandas==3.1.1",
    "pyarrow>=17",
    "scikit-learn==1.9.1",
    "catboost==1.2.10",
    "imbalanced-learn==0.14.2",
    "pyyaml>=6",
    "psutil>=5.9",
    "streamlit>=1.40",
    "tabulate>=0.9",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netirava"]

[tool.pytest.ini_options]
testpaths = ["tests"]
